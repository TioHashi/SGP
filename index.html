<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGP - Pagina Inicial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f5f6f8;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .brand-mark img {
      width: 100%;
      height: auto;
      display: block;
    }

    .nav-link.btn {
      color: #fff;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .chart-panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 18px;
      text-align: center;
      min-height: 390px;
    }

    .chart-wrap {
      width: min(320px, 100%);
      margin: 18px auto 0;
    }

    @media (max-width: 760px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .navbar-nav {
        gap: 8px;
        padding-top: 12px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="./">
        <span class="brand-mark">
          <img src="static/img/log.png" alt="SGP">
        </span>
        SGP
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link mx-2 btn rounded-0 btn-danger active" href="./">Pagina Inicial</a>
          </li>
          <li class="nav-item">
            <a class="nav-link mx-2 btn rounded-0 btn-danger disabled" aria-disabled="true">Cadastrar Servidores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link mx-2 btn rounded-0 btn-danger disabled" aria-disabled="true">Gerenciar Servidores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link mx-2 btn rounded-0 btn-danger disabled" aria-disabled="true">Gerenciar Folha</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="dashboard-grid">
      <section class="chart-panel">
        <h2 class="h4">Quantidade de Servidores por Lotacao</h2>
        <div class="chart-wrap">
          <canvas id="localPieChart"></canvas>
        </div>
      </section>

      <section class="chart-panel">
        <h2 class="h4">Vinculo</h2>
        <div class="chart-wrap">
          <canvas id="vinculoPieChart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const localData = {"labels":["SEMED"],"data":[1]};
    const vinculoData = {"labels":["Efetivo"],"data":[1]};
    const palette = [
      "rgba(255, 99, 132, 0.8)",
      "rgba(54, 162, 235, 0.8)",
      "rgba(255, 206, 86, 0.8)",
      "rgba(75, 192, 192, 0.8)",
      "rgba(153, 102, 255, 0.8)",
      "rgba(255, 159, 64, 0.8)"
    ];

    function createPieChart(id, source) {
      const ctx = document.getElementById(id).getContext("2d");
      return new Chart(ctx, {
        type: "pie",
        data: {
          labels: source.labels,
          datasets: [{
            data: source.data,
            backgroundColor: palette
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom"
            }
          }
        }
      });
    }

    createPieChart("localPieChart", localData);
    createPieChart("vinculoPieChart", vinculoData);
  </script>
</body>
</html>
