services:
  sgp:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8000:8080"
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py sync_firebase &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8080"
