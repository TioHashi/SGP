services:
  sgp:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8000:8080"
    volumes:
      - sgp_data:/app/data
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py sync_firebase &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8080"

volumes:
  sgp_data:
