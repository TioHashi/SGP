<div class="form-field {% if span %}{{ span }}{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}
    <small>{{ field.help_text }}</small>
  {% endif %}
  {% if field.errors %}
    <small>{{ field.errors|striptags }}</small>
  {% endif %}
</div>
