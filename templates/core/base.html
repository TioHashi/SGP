{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SGP{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">SGP</a>
    <nav class="main-nav" aria-label="Principal">
      <a href="{% url 'dashboard' %}">Inicio</a>
      <a href="{% url 'servidor_lista' %}">Servidores</a>
      <a href="{% url 'folha_selecionar' %}">Folha</a>
      <a href="{% url 'relatorios' %}">Relatorios</a>
    </nav>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="logout-button" type="submit">Sair</button>
    </form>
  </header>

  <main class="page">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
